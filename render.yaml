services:
  - type: web
    name: peerpulse
    runtime: node
    plan: free
    buildCommand: npm run install:all && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES
        value: 1d
      - key: VITE_API_URL
        value: /api
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        sync: false
